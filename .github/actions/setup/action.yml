name: Setup (checkout, Node.js, dependencies)
description: Checkout the repo, install Node.js with the npm cache, and run npm ci

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

name: Build, Push & Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    outputs:
      server_tag: ghcr.io/${{ steps.prep.outputs.owner_lc }}/shiftcrack-server:sha-${{ github.sha }}
      web_tag: ghcr.io/${{ steps.prep.outputs.owner_lc }}/shiftcrack-web:sha-${{ github.sha }}
      owner_lc: ${{ steps.prep.outputs.owner_lc }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase registry owner
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Server image
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner_lc }}/shiftcrack-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=sha,format=short,prefix=sha-

      - name: Build and push Server Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner_lc }}/shiftcrack-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=sha,format=short,prefix=sha-

      - name: Build and push Web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api/v1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote VM over SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository for compose file
        uses: actions/checkout@v4

      - name: Ensure target deployment directory exists on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            mkdir -p "${{ vars.VM_DEPLOY_PATH || '/opt/shiftcrack' }}"

      - name: Copy docker-compose.prod.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "${{ vars.VM_DEPLOY_PATH || '/opt/shiftcrack' }}"

      - name: Execute deployment commands over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH || '/opt/shiftcrack' }}
          SERVER_IMAGE: ${{ needs.build-and-push.outputs.server_tag }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web_tag }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USERNAME,DEPLOY_PATH,SERVER_IMAGE,WEB_IMAGE
          script: |
            set -e
            cd "$DEPLOY_PATH"

            echo "=== 1. Checking environment file ==="
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found in $DEPLOY_PATH!"
              echo "Please create $DEPLOY_PATH/.env with production credentials before deploying."
              exit 1
            fi

            echo "=== 2. Authenticating with GHCR on VM ==="
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            echo "=== 3. Pulling updated production images ==="
            SERVER_IMAGE="$SERVER_IMAGE" WEB_IMAGE="$WEB_IMAGE" docker compose -f docker-compose.prod.yml pull

            echo "=== 4. Starting PostgreSQL database and waiting for readiness ==="
            docker compose -f docker-compose.prod.yml up -d postgres --wait

            echo "=== 5. Applying Prisma database migrations ==="
            SERVER_IMAGE="$SERVER_IMAGE" docker compose -f docker-compose.prod.yml run --rm server npx prisma migrate deploy

            echo "=== 6. Recreating and starting production containers ==="
            SERVER_IMAGE="$SERVER_IMAGE" WEB_IMAGE="$WEB_IMAGE" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== 7. Pruning dangling Docker images ==="
            docker image prune -f

            echo "=== 8. Verification: Container statuses ==="
            docker compose -f docker-compose.prod.yml ps

name: ShiftCrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Обов'язковий крок перед викликом локальних файлів

      - name: Setup (Node.js, npm ci)
        uses: ./.github/actions/setup # Тепер GitHub бачить цей файл

      - name: Generate Prisma Client (before typecheck)
        run: npm run prisma:generate --workspace @shiftcrack/server
        
      - name: Build shared contracts (types consumed by server/web)
        run: npm run build --workspace @shiftcrack/shared

      - name: Lint (eslint, all workspaces)
        run: npm run lint

      - name: Typecheck (tsc, all workspaces)
        run: npm run typecheck

  # SDD §7, job 2: vitest for the backend (cipher services, scoring,
  # normalization). Unit tests need no PostgreSQL instance.
  test:
    name: Tests (Vitest)
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Setup (checkout, Node.js, npm ci)
        uses: ./.github/actions/setup

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace @shiftcrack/server

      - name: Build shared contracts
        run: npm run build --workspace @shiftcrack/shared

      - name: Run tests
        run: npm run test

  # SDD §7, job 3: root build = shared tsc -> server tsc. apps/web (Next.js
  # build) joins this chain when phase 4.3 lands.
  build:
    name: Build (shared + server)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup (checkout, Node.js, npm ci)
        uses: ./.github/actions/setup

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace @shiftcrack/server

      - name: Build
        run: npm run build

  # SDD §7, job 4: dependency security gate. Runs against the lockfile only
  # (no install needed); fails on high/critical advisories.
  audit:
    name: npm audit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Audit dependencies
        run: npm audit --audit-level=high
